spring.application.name=pagamentos-ms

# Banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/alurafood_pagamento?createDatabaseIfNotExist=true
spring.datasource.username=developer
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.int}

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.atualizarPedido.slidingWindowSize: 3
resilience4j.circuitbreaker.instances.atualizarPedido.minimumNumberOfCalls: 2
resilience4j.circuitbreaker.instances.atualizarPedido.waitDuratonInOpenState: 50s

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
